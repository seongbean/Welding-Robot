# 모재 오차 분포 (Isaac Sim 시뮬용). 범위는 모두 가정치이며, 실측하면 이 파일만 고친다.
# 표기: [lo, hi] = 균등분포 구간, 숫자 하나 = ±그 값 대칭 균등분포. 길이 mm, 각도 deg.
# 계획 문서: "모재 오차 모델링 계획" (Claude Doc), sim_errors/README.md

geometry:                  # T이음 필릿. 모재 좌표계: 원점 = 이음매 시작점, x = 이음매 방향,
  joint: fillet_t          #   바닥 판 윗면 z=0, 웹 판 용접 쪽 면 y=0 (용접 토치는 -y 쪽에서 접근)
  length_mm: 300
  base_width_mm: 200       # 바닥 판 폭 (이음매 양쪽 합)
  base_thickness_mm: 10
  web_height_mm: 100
  web_thickness_mm: 10

nominal_pose:              # 로봇 베이스(link0) 기준 모재 좌표계. expert_to_sim.py는 기본으로 이 값을 무시하고
  xyz_mm: [500, 150, 0]    #   시작 자세의 토치 팁 근처에 모재를 자동 배치한다(--use-scenario-pose로 이 값 사용).
  rpy_deg: [0, 0, -90]     #   x_part = -Y, y_part = +X → 토치가 로봇 쪽에서 접근

pre_weld:                  # 용접 전 (에피소드 시작에 한 번 정해짐)
  place_xyz_mm: 3.0        # 지그 배치 오차, 축별 ±
  place_rpy_deg: 1.0
  icp_xyz_mm: [0.3, 1.5]   # ICP 잔차 크기 (방향은 랜덤)
  icp_rot_deg: [0.1, 0.5]
  web_bow_mm_per_m: 2.0    # 웹 판 직진도: 좌우 활 모양 처짐 (이음매 길이 비례), ±
  web_wave_mm: [0.0, 0.5]  # 웹 판 좌우 물결 진폭
  base_bow_mm_per_m: 1.5   # 바닥 판 평평도: 높이 활 모양, ±
  base_wave_mm: [0.0, 0.3]
  wave_cycles: [0.5, 3.0]  # 물결 주기 수 (이음매 전체 길이당)
  gap_mm: [0.0, 2.0]       # 루트 틈새 (시작점)
  gap_taper_mm: 1.0        # 끝점 틈새 = 시작 + ±값 (0 미만은 0)
  tack_count: [2, 4]       # 가접 개수 (정수)
  tack_length_mm: [10, 20]
  tack_height_mm: [1.0, 3.0]

in_weld:                   # 용접 중. 모두 아크 진행도 s_arc(0~1)의 함수
  drift_prob: 0.7          # 서서히 밀림이 생길 확률
  drift_mm: [0.0, 3.0]     # 총 밀림량 (바닥 판 평면 안, 방향 랜덤)
  drift_span: [0.1, 0.4]   # 밀림이 일어나는 진행도 구간 길이
  jump_prob: 0.3           # 갑자기 튈 확률
  jump_mm: [0.5, 2.0]
  base_angle_deg: [0.5, 2.0]   # 바닥 판 각변형 최종값 (아크 뒤쪽 날개가 들림)
  web_tilt_deg: 1.0            # 웹 판 기울어짐 최종값, ±
  distort_length_mm: [30, 100] # 아크 뒤에서 각변형이 최종값에 다가가는 길이 λ
  bow_mm: 1.5                  # 세로 휨 최종 처짐 (진행도에 비례해 자람, 아크 앞쪽도 움직임), ±
  gap_close_mm: [0.0, 1.0]     # 아크 앞쪽 틈새 닫힘 최대량

sensors:                   # laser_* = 토치 앞 이음매 단면 센서 모델. 실기(아크 없는 시연)에서는 손목 depth 카메라 단면에 해당
  laser_lookahead_mm: 30   # 단면 측정점: 토치 앞 거리
  laser_noise_mm: 0.1      # 틈새 폭 측정 표준편차. 실제 depth 카메라로 시연 시편을 재서 맞출 것
  laser_dropout: 0.05      # 단면 전체 측정 실패 확률 (반사·가림)
  laser_point_noise_mm: 0.2   # 단면 패치 점마다 깊이 노이즈 표준편차 (좌우·높이·각도 노이즈는 평면 맞춤에서 나옴)
  laser_point_dropout: 0.1    # 점마다 측정 구멍 확률 (금속 반사)
  laser_patch_along_mm: 10    # 평면을 맞추는 패치: 이음매 방향 길이
  laser_patch_across_mm: 15   #   판마다 뿌리에서 바깥으로 폭
  laser_point_step_mm: 1.0    #   점 간격
  prescan_mm: 30              # 용접 전 시작 구간 스캔 길이 (아크 끄고 손목 카메라로). 0이면 안 함.
                              #   단면은 토치 앞 30 mm만 재므로 스캔이 없으면 시작 30 mm(첫 가접)를 못 본다
  prescan_step_mm: 0.5        #   스캔 단면 간격

expert:                    # 규칙 전문가 (privileged: 실제 경로를 안다)
  travel_speed_mm_s: 5.0
  min_speed_ratio: 0.5
  speed_drop_per_gap_mm: 0.15  # 틈새 1 mm당 속도 감소 비율. WPS 값으로 바꿀 것 (시뮬로 검증 불가)
  weave_amp_mm: 1.0            # 위빙 진폭 = 기본 + 틈새 비례, 상한
  weave_amp_per_gap: 1.0
  weave_amp_max_mm: 3.0
  weave_hz: 1.0
  travel_angle_deg: 10.0       # 미는 각 (토치가 진행 방향으로 기운 각)
  standoff_mm: 2.0             # 와이어 끝과 이음매 사이 (이등분 방향)
  tack_follow: 1.0             # 가접 위에서 그 높이만큼 토치를 올리는 비율
  approach_height_mm: 40       # 시작점 위 접근 높이 (이등분 방향)
  approach_speed_mm_s: 50
  descend_speed_mm_s: 15
  retract_height_mm: 50

episode:                   # 학습용 묶음 (에피소드 생성 사양 "에피소드 구성"). make_scenarios --batch가 사용
  counts: {clean: 30, single: 65, mixed: 205, hard: 30}   # 시편군당. 단독 = 오차 13종 × 5
  hard_scale: 1.5          # 가혹 묶음(평가 전용): 오차 범위 × 이 값
  split: [0.8, 0.1, 0.1]   # 학습 · 검증 · 시험, 에피소드(시드) 단위. 가혹은 모두 평가
  weave_ratio: 0.5         # 위빙 모드 에피소드 비율 (나머지는 직선 모드: 위빙 0, 속도만 보정)
  perturb_ratio: 0.5       # 혼합 묶음에서 실행 섭동을 넣는 비율
  start_offset:            # 시작 토치 어긋남, ± 균등 (이음매 시작점 근처에 바로 놓음)
    lateral_mm: 2.0
    height_mm: 2.0
    work_deg: 2.0
    travel_deg: 2.0
  start_settle_s: 0.3      # 시작 어긋남을 실행 명령에서 지수로 줄이는 시간상수 (정답에는 없음)
  perturb:                 # 실행 섭동 (DART 방식): 라벨은 섭동 없는 전문가 값
    lateral_mm: 0.5        # 표준편차
    height_mm: 0.5
    angle_deg: 1.0         # 작업각·진행각 표준편차
    duration_s: [0.5, 2.0] # 한 번 지속 (반 코사인 창)
    interval_s: [1.0, 4.0] # 섭동 사이 쉬는 시간

# 시편군별 설정 (에피소드 생성 사양 "시편"). 위 섹션이 T 필릿 기본값이자 공통값이고, 여기는 바꿀 것만 쓴다.
# make_scenarios --family <군>으로 고른다. 수치는 모두 가정치.
families:
  fillet_corner:           # ㄱ자 코너 필릿 (수평 필릿 2F). 웹이 바닥 판 끝 위에 바깥 면을 맞춰 선다.
    geometry:              #   poscoenc corner 시편(두께 18, 날개 180)에서 모양만, 길이는 T와 같게 300
      length_mm: 300
      base_width_mm: 180   # 바닥 판 토치 쪽 날개 폭 (T와 달리 한쪽만)
      base_thickness_mm: 18
      web_height_mm: 180
      web_thickness_mm: 18
    pre_weld:
      web_bow_mm_per_m: 2.5   # 웹이 바닥 판 끝에만 얹혀 있어 T보다 조금 더 휜다고 가정
      web_square_deg: 2.0     # 웹 직각도: 조립 때 웹이 90°에서 기운 각, ± (코너만. 웹 뒤를 받치는 판이 없음)
    in_weld:
      web_tilt_deg: 2.0       # 웹 뒤쪽을 잡아 주는 판이 없어 T(±1°)보다 더 기운다고 가정
      base_angle_deg: [0.5, 2.5]   # 날개 한쪽만 있어 구속이 약함
    episode:
      counts: {single: 70}    # 단독 = 오차 14종(웹 직각도 포함) × 5
  butt_v:                  # 맞대기 V홈 (아래보기 1G, 루트 패스만). 두 판이 홈을 사이에 두고 같은 평면에 눕는다.
    geometry:              #   poscoenc에 평판 맞대기 시편이 없어 흔한 값으로 가정 (관 시편 두께 12 mm와 같게)
      length_mm: 300
      plate_width_mm: 150  # 판 하나의 폭 (이음매에서 바깥까지)
      thickness_mm: 12
      bevel_deg: 30        # 개선 각 (한쪽, 연직에서). 홈 각 60°
      root_face_mm: 1.5    # 루트 면 높이
    pre_weld:
      gap_mm: [1.0, 3.0]   # 루트 틈새: 맞대기 루트 패스는 틈새를 두고 조립한다
      web_bow_mm_per_m: 2.0   # 맞대기에서는 이음선 좌우 직진도 (두 판 끝 맞춤)
      hi_lo_mm: 1.0        # 단차: 오른쪽 판이 왼쪽보다 높은 양, ± (맞대기만)
    in_weld:
      base_angle_deg: [0.5, 2.5]   # 맞대기에서는 양쪽 판 각변형 (날개가 같이 들림). 이등분선은 그대로
      web_tilt_deg: 1.0            # 맞대기에서는 좌우 판 각변형 차이 (오른쪽 - 왼쪽), ±. 작업각 = 절반
      gap_close_mm: [0.0, 1.5]     # 가로 수축으로 아크 앞 틈새가 필릿보다 더 닫힌다고 가정
    episode:
      counts: {single: 70}    # 단독 = 오차 14종(단차 포함) × 5
