name: Experiment (kinematic gen + BC train + eval)

# 오래 걸리는 실험(운동학 사양 묶음 생성 → 변환 → MLP/GRU 학습 → 닫힌 루프 평가)을 GitHub에서 돌린다.
# Actions 탭의 "Run workflow"에서 브랜치를 골라 손으로 돌린다.
# 한 번에 러너 약 5시간분을 쓰므로 push마다 돌지 않게 했다.
# 결과: 실행 요약(Summary)의 표. 작업 사이에 에피소드·모델·평가를 넘길 때는 아티팩트 대신 actions/cache를 쓴다
# (저장소 아티팩트 저장 한도가 이전 실험 에피소드로 차서 업로드가 막혔기 때문. 캐시는 따로 10 GB, 7일 안 쓰면 지워짐).
# 지금 실험: 파이프 원주 추가 (T 필릿, ㄱ자 코너 필릿, 맞대기 V홈, 파이프 원주). 공용 MLP 하나(사용자 결정)에 파이프를 넣는다.
#   mlp_all = 네 군 모두 (공용 정책), mlp_3 = T+코너+V홈만 (파이프로 옮겨 가는지), mlp_pipe = 파이프만,
#   mlp_all_q = 네 군 섞되 학습 수를 세 군과 같게 (파이프를 넣어서 다른 군이 나빠지는지 수량 대조), gru_all, rule.
#   모두 용접 전 시작 구간 스캔 있음. no_hilo = V홈·파이프 단차를 끄는 대조, no_oval = 파이프 진원도를 끄는 대조.
#   이전 실험: 시작 구간 스캔 (PR #21), T/코너 교차 학습 (PR #23), V홈 추가 (PR #25) 는 이 파일의 git 기록에 있다.

on:
  workflow_dispatch:
    inputs:
      scale:
        description: '묶음 개수 배율 (1.0 = 시편군마다 사양 수량, T 330 · 코너 335 · V홈 335 · 파이프 340)'
        default: '1.0'
      no_hilo:
        description: 'V홈·파이프 단차를 끔 (대조 실험)'
        type: boolean
        default: false
      no_oval:
        description: '파이프 진원도를 끔 (대조 실험)'
        type: boolean
        default: false

env:
  SCALE: ${{ github.event.inputs.scale || '1.0' }}
  SHARDS: 8

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pyyaml
      - name: Make batches (T + corner + butt V + pipe) and pick this shard
        run: |
          python -m sim_errors.make_scenarios --batch --scale "$SCALE" --out batch_all
          python -m sim_errors.make_scenarios --batch --scale "$SCALE" --family fillet_corner --out batch_all
          CFG=sim_errors/config/part_errors.yaml
          python - "$CFG" cfg_run.yaml "${{ github.event.inputs.no_hilo }}" "${{ github.event.inputs.no_oval }}" <<'PY'
          import sys, yaml
          src, dst, no_hilo, no_oval = sys.argv[1:]
          c = yaml.safe_load(open(src, encoding='utf-8'))
          if no_hilo == 'true':
              for f in ('butt_v', 'pipe_girth'):
                  c['families'][f]['pre_weld']['hi_lo_mm'] = 0
          if no_oval == 'true':
              c['families']['pipe_girth']['pre_weld']['oval_mm'] = 0
          yaml.safe_dump(c, open(dst, 'w', encoding='utf-8'), allow_unicode=True)
          PY
          python -m sim_errors.make_scenarios --config cfg_run.yaml --batch --scale "$SCALE" --family butt_v --out batch_all
          python -m sim_errors.make_scenarios --config cfg_run.yaml --batch --scale "$SCALE" --family pipe_girth --out batch_all
          mkdir -p batch
          ls batch_all/*.json | sort | awk -v n="$SHARDS" -v k=${{ matrix.shard }} 'NR % n == k' | xargs -I{} cp {} batch/
          ls batch | wc -l
      - name: Kinematic episodes
        run: python sim_bridge/run_batch.py batch --out ep/${{ matrix.shard }} --kinematic --jobs 2
      - uses: actions/cache/save@v4
        with:
          path: ep/${{ matrix.shard }}
          key: episodes-${{ github.run_id }}-${{ matrix.shard }}

  train:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy pyyaml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache/restore@v4
        with:
          path: ep/0
          key: episodes-${{ github.run_id }}-0
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/1
          key: episodes-${{ github.run_id }}-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/2
          key: episodes-${{ github.run_id }}-2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/3
          key: episodes-${{ github.run_id }}-3
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/4
          key: episodes-${{ github.run_id }}-4
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/5
          key: episodes-${{ github.run_id }}-5
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/6
          key: episodes-${{ github.run_id }}-6
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/7
          key: episodes-${{ github.run_id }}-7
          fail-on-cache-miss: true
      - run: mkdir -p episodes && cp ep/*/*.npz episodes/ && ls episodes | wc -l
      - name: Convert (all families in one dataset)
        run: python -m learning.to_lerobot episodes --out data --no-lerobot
      - name: Train (all, without pipe, pipe only)
        run: |
          python -m learning.train_bc data --model mlp --out runs/mlp_all
          python -m learning.train_bc data --model gru --out runs/gru_all
          python -m learning.train_bc data --model mlp --family fillet_t,fillet_corner,butt_v --out runs/mlp_3
          python -m learning.train_bc data --model mlp --family pipe_girth --out runs/mlp_pipe
          # 수량 대조: 네 군 섞되 학습 수를 세 군(파이프 뺀 것)과 같게. 파이프를 넣은 효과와 수량 효과를 가른다
          n3=$(python -c "import json; m = json.load(open('runs/mlp_3/train_log.json')); print(m['train_episodes'])")
          echo "세 군 학습 에피소드 $n3"
          python -m learning.train_bc data --model mlp --max-train "$n3" --out runs/mlp_all_q
      - uses: actions/cache/save@v4
        with:
          path: |
            runs/
            data/
          key: runs-${{ github.run_id }}

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [mlp_all, mlp_3, mlp_pipe, mlp_all_q, gru_all, rule]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy pyyaml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache/restore@v4
        with:
          path: ep/0
          key: episodes-${{ github.run_id }}-0
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/1
          key: episodes-${{ github.run_id }}-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/2
          key: episodes-${{ github.run_id }}-2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/3
          key: episodes-${{ github.run_id }}-3
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/4
          key: episodes-${{ github.run_id }}-4
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/5
          key: episodes-${{ github.run_id }}-5
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/6
          key: episodes-${{ github.run_id }}-6
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ep/7
          key: episodes-${{ github.run_id }}-7
          fail-on-cache-miss: true
      - run: mkdir -p episodes && cp ep/*/*.npz episodes/ && ls episodes | wc -l
      - uses: actions/cache/restore@v4
        with:
          path: |
            runs/
            data/
          key: runs-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Closed-loop evaluation (T, corner, butt V, pipe test sets)
        run: |
          p=${{ matrix.policy }}
          if [ "$p" = rule ]; then
            python -m learning.evaluate rule --data data --episodes episodes --jobs 2 --rule-dir runs
          else
            python -m learning.evaluate runs/$p/policy.pt --data data --episodes episodes --jobs 2
          fi
          mkdir -p out/$p && cp runs/$p/eval.json out/$p/
          [ -f runs/$p/train_log.json ] && cp runs/$p/train_log.json out/$p/ || true
      - uses: actions/cache/save@v4
        with:
          path: out/${{ matrix.policy }}
          key: eval-${{ github.run_id }}-${{ matrix.policy }}

  report:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: out/mlp_all
          key: eval-${{ github.run_id }}-mlp_all
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/mlp_3
          key: eval-${{ github.run_id }}-mlp_3
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/mlp_pipe
          key: eval-${{ github.run_id }}-mlp_pipe
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/mlp_all_q
          key: eval-${{ github.run_id }}-mlp_all_q
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/gru_all
          key: eval-${{ github.run_id }}-gru_all
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: out/rule
          key: eval-${{ github.run_id }}-rule
          fail-on-cache-miss: true
      - name: Summary table
        run: |
          {
            for f in pipe_girth fillet_t fillet_corner butt_v; do
              case $f in fillet_t) name="T 필릿";; fillet_corner) name="코너 필릿";; butt_v) name="맞대기 V홈";; *) name="파이프 원주";; esac
              echo "## ${name} 시험 (전체)"
              python -m learning.report_evals out/*/eval.json --kind fam_$f
              echo
              echo "## ${name} 가혹 묶음"
              python -m learning.report_evals out/*/eval.json --kind fam_${f}_hard
              echo
              echo "## ${name} 혼합 묶음"
              python -m learning.report_evals out/*/eval.json --kind fam_${f}_mixed
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
