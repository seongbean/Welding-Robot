name: Experiment (kinematic gen + BC train + eval)

# 오래 걸리는 실험(운동학 사양 묶음 생성 → 변환 → MLP/GRU 학습 → 닫힌 루프 평가)을 GitHub에서 돌린다.
# Actions 탭의 "Run workflow"에서 브랜치를 골라 손으로 돌린다.
# 한 번에 러너 약 5시간분을 쓰므로 push마다 돌지 않게 했다.
# 결과: 실행 요약(Summary)의 표, 그리고 eval-* 아티팩트(eval.json).
# 지금 실험: 시편군 (T 필릿, ㄱ자 코너 필릿). 정책을 T만 / 코너만 / 둘 다로 학습하고 두 군 시험에서 본다
#   (한 정책이 두 군을 덮는지, T 정책이 코너로 옮겨 가는지). 모두 용접 전 시작 구간 스캔 있음.
#   이전 실험(시작 구간 스캔 있음/없음)은 PR #21 때 이 파일의 git 기록에 있다.

on:
  workflow_dispatch:
    inputs:
      scale:
        description: '묶음 개수 배율 (1.0 = 시편군마다 사양 수량, T 330 · 코너 335)'
        default: '1.0'

env:
  SCALE: ${{ github.event.inputs.scale || '1.0' }}
  SHARDS: 6

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pyyaml
      - name: Make batches (T + corner) and pick this shard
        run: |
          python -m sim_errors.make_scenarios --batch --scale "$SCALE" --out batch_all
          python -m sim_errors.make_scenarios --batch --scale "$SCALE" --family fillet_corner --out batch_all
          mkdir -p batch
          ls batch_all/*.json | sort | awk -v n="$SHARDS" -v k=${{ matrix.shard }} 'NR % n == k' | xargs -I{} cp {} batch/
          ls batch | wc -l
      - name: Kinematic episodes
        run: python sim_bridge/run_batch.py batch --out episodes --kinematic --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: episodes-${{ matrix.shard }}
          path: episodes/*.npz
          retention-days: 7

  train:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy pyyaml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: episodes-*
          path: episodes
          merge-multiple: true
      - name: Convert (both families in one dataset)
        run: python -m learning.to_lerobot episodes --out data --no-lerobot
      - name: Train (T only, corner only, both)
        run: |
          for m in mlp gru; do
            python -m learning.train_bc data --model $m --family fillet_t --out runs/${m}_t
            python -m learning.train_bc data --model $m --family fillet_corner --out runs/${m}_corner
            python -m learning.train_bc data --model $m --out runs/${m}_both
          done
      - uses: actions/upload-artifact@v4
        with:
          name: runs
          path: |
            runs/
            data/
          retention-days: 7

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [mlp_t, mlp_corner, mlp_both, gru_t, gru_corner, gru_both, rule]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy pyyaml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: episodes-*
          path: episodes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: runs
          path: .
      - name: Closed-loop evaluation (T and corner test sets)
        run: |
          p=${{ matrix.policy }}
          if [ "$p" = rule ]; then
            python -m learning.evaluate rule --data data --episodes episodes --jobs 2 --rule-dir runs
          else
            python -m learning.evaluate runs/$p/policy.pt --data data --episodes episodes --jobs 2
          fi
          mkdir -p out/$p && cp runs/$p/eval.json out/$p/
          [ -f runs/$p/train_log.json ] && cp runs/$p/train_log.json out/$p/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.policy }}
          path: out/
          retention-days: 30

  report:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: out
          merge-multiple: true
      - name: Summary table
        run: |
          {
            for f in fillet_corner fillet_t; do
              name=$([ $f = fillet_t ] && echo "T 필릿" || echo "코너 필릿")
              echo "## ${name} 시험 (전체)"
              python -m learning.report_evals out/*/eval.json --kind fam_$f
              echo
              echo "## ${name} 가혹 묶음"
              python -m learning.report_evals out/*/eval.json --kind fam_${f}_hard
              echo
              echo "## ${name} 혼합 묶음"
              python -m learning.report_evals out/*/eval.json --kind fam_${f}_mixed
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
