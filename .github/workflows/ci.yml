name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # ROS2 Jazzy(Ubuntu 24.04) 기본 파이썬
      - name: Install dependencies
        run: |
          pip install pin numpy pyyaml pytest ruff
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check --select E,F,W --ignore E501 .
      - name: Unit tests (ROS 불필요)
        run: pytest weld_teleop/test sim_errors/test sim_bridge/test learning/test common/test -v
