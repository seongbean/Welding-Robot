# 기본 SO-101 (팔 5관절 + 그리퍼) — 파이프라인 검증용
# TODO: 아래 joint/frame 이름은 TheRobotStudio SO-ARM100 저장소의 so101 URDF 기준 추정값.
#       실제 사용하는 URDF를 열어 이름을 확인할 것.
leader_state_node:
  ros__parameters:
    driver: mock               # 실기: feetech
    joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    rate_hz: 100.0
    port: /dev/ttyACM0
    baudrate: 1000000
    servo_ids: [1, 2, 3, 4, 5]
    offsets: [2048, 2048, 2048, 2048, 2048]   # URDF 영점 자세에서의 tick 값으로 캘리브레이션
    signs: [1, 1, 1, 1, 1]
    aux_servo_id: 6            # 그리퍼 서보 (용도 미정, -1이면 비활성)
    aux_range: [0, 4095]

leader_fk_node:
  ros__parameters:
    joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    ee_frame: gripper_frame_link
    tool_xyz: [0.0, 0.0, 0.0]
    tool_rpy: [0.0, 0.0, 0.0]
    base_frame: leader_base
