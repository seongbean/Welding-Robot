follower_ik_node:
  ros__parameters:
    joint_names: [joint0, joint1, joint2, joint3, joint4, joint5]
    ee_frame: tcp                    # opti3.urdf: link6 플랜지에 오프셋 0
    # 용접 토치 팁(와이어 끝): Isaac Sim 장면 posco_torch.usd의 /World/indy/link6/tcp/weld_tip 값 (CAD 기준)
    # rpy는 팁 z축을 토치 방향(tcp 기준 y축 45°)에 맞춤. TODO: 실물 와이어 돌출 길이 실측 확인
    tool_xyz: [0.1876, 0.0, 0.368]
    tool_rpy: [0.0, 0.7854, 0.0]
    base_frame: link0
    joint_state_topic: /joint_states
    rate_hz: 100.0
    max_joint_step: 0.01             # rad/cycle (100Hz면 약 1 rad/s)
    ik_tolerance: 0.001
    ik_accept_error: 0.02            # 이 오차까지는 IK 근사 해(가장 가까운 자세)로 명령. 범위 경계·특이점에서 멈추지 않게
    max_track_error: 0.1             # rad, 명령-실측 차이가 넘으면 정지 후 실측으로 재동기화
    input_timeout: 0.2               # s, 목표 포즈·관절 상태가 끊기면 명령 정지
    dry_run: true                    # 실기 명령 전 반드시 RViz로 확인
    output_type: joint_trajectory    # | float64_array
    command_topic: /joint_trajectory_controller/joint_trajectory   # TODO: 실기 컨트롤러 확인
    loopback: false
    initial_q: [0.0, 0.0, -1.57, 0.0, -1.57, 0.0]   # URDF ros2_control initial_value 기준
